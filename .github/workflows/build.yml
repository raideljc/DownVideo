name: Build APK with Buildozer

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK for Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Date for Cache
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV

      # ========== INSTALAR DEPENDENCIAS DEL SISTEMA ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            unzip \
            openjdk-17-jdk-headless \
            ccache \
            ninja-build \
            libxslt1-dev

      # ========== SETUP JAVA ==========
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set JAVA_HOME
        run: |
          echo "JAVA_HOME=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.20-1/x64" >> $GITHUB_ENV

      # ========== SETUP PYTHON ==========
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ========== DESCARGAR Y CONFIGURAR ANDROID SDK/NDK ==========
      - name: Setup Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          
          # Descargar Android SDK
          if [ ! -d "android-sdk" ]; then
            echo "📥 Downloading Android SDK..."
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            rm cmdline-tools.zip
            mkdir -p android-sdk/cmdline-tools
            mv cmdline-tools android-sdk/cmdline-tools/latest
          fi
          
          # Configurar SDK
          export PATH="$PATH:~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --sdk_root=~/.buildozer/android/platform/android-sdk "platform-tools" "platforms;android-33" "build-tools;33.0.0" 2>&1 | grep -v "Warning"

      - name: Setup Android NDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          
          # Descargar NDK 25b
          if [ ! -d "android-ndk-r25b" ]; then
            echo "📥 Downloading Android NDK r25b..."
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
            unzip -q ndk.zip
            rm ndk.zip
          fi

      # ========== INSTALAR BUILDOZER Y DEPENDENCIAS ==========
      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36
          pip install buildozer
          pip install -r requirements.txt 2>/dev/null || echo "requirements.txt no encontrado"

      # ========== CONFIGURAR VARIABLES DE ENTORNO ==========
      - name: Configure environment
        run: |
          echo "ANDROID_HOME=~/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK=~/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=~/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=~/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          
          # Agregar build-tools al PATH
          echo "~/.buildozer/android/platform/android-sdk/build-tools/33.0.0:$PATH" >> $GITHUB_ENV

      # ========== LIMPIAR CACHÉ ANTERIOR SI ES NECESARIO ==========
      - name: Clean old buildozer cache
        run: |
          # Limpiar distribuciones viejas para ahorrar espacio
          rm -rf ~/.buildozer/android/platform/build* 2>/dev/null || true
          du -sh ~/.buildozer/android 2>/dev/null || echo "Cache empty"

      # ========== COMPILAR APK ==========
      - name: Build APK (Debug)
        id: buildozer
        run: |
          set -e
          
          export PATH="~/.buildozer/android/platform/android-sdk/build-tools/33.0.0:~/.buildozer/android/platform/android-sdk/platform-tools:$PATH"
          
          echo "🔨 Starting Buildozer compilation..."
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Android NDK: $ANDROID_NDK"
          
          # Verificar que existen las herramientas
          if [ ! -f "$ANDROID_SDK_ROOT/build-tools/33.0.0/aapt" ]; then
            echo "❌ AAPT not found!"
            ls -la $ANDROID_SDK_ROOT/build-tools/33.0.0/ || echo "build-tools directory not found"
            exit 1
          fi
          
          # Compilar
          yes | buildozer -v android debug 2>&1 | tee build.log
          
          # Verificar APK
          if [ ! -d "bin" ] || [ -z "$(ls bin/*.apk 2>/dev/null)" ]; then
            echo "❌ APK not created"
            echo "Checking bin directory..."
            ls -la bin/ 2>/dev/null || echo "bin directory not found"
            echo "Last 150 lines of build log:"
            tail -150 build.log
            exit 1
          fi
          
          APK_FILE=$(ls -t bin/*.apk 2>/dev/null | head -1)
          echo "✅ APK created: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_FILE)" >> $GITHUB_OUTPUT
          ls -lah bin/

      # ========== SUBIR ARTEFACTOS ==========
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk-debug
          path: bin/*.apk
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7

      # ========== CREAR RELEASE ==========
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== RESUMEN ==========
      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if ls bin/*.apk 1> /dev/null 2>&1; then
            echo "✅ APK Generated Successfully" >> $GITHUB_STEP_SUMMARY
            echo "**APK:** 
