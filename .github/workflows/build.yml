name: Build APK Basica

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build-android:
    # Opción A: Usar Ubuntu 24.04 (más reciente y aún soportado)
    runs-on: ubuntu-24.04
    
    # Opción B: Usar Ubuntu 22.04 (más antiguo, pero el PPA sí existe)
    # runs-on: ubuntu-22.04

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Compilar con Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-apk
          path: ${{ steps.buildozer.outputs.filename }}
