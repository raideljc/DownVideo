name: Build APK with Buildozer

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK for Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Date for Cache
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV

      # ========== CACHÉ ==========
      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ env.date }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-ndk
          key: ${{ runner.os }}-android-ndk-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-ndk-

      # ========== INSTALAR DEPENDENCIAS DEL SISTEMA ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            unzip \
            openjdk-17-jdk-headless \
            ccache

      # ========== SETUP JAVA ==========
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ========== SETUP PYTHON ==========
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ========== INSTALAR BUILDOZER ==========
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36
          pip install buildozer
          pip install -r requirements.txt

      # ========== COMPILAR DEBUG APK ==========
      - name: Build APK (Debug)
        id: buildozer
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log
          APK_FILE=$(ls -t bin/*.apk 2>/dev/null | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_FILE)" >> $GITHUB_OUTPUT
          echo "✅ APK built successfully: $APK_FILE"

      # ========== SUBIR ARTEFACTOS ==========
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk-debug
          path: bin/*.apk
          retention-days: 30

      # ========== CREAR RELEASE (SI ES TAG) ==========
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
          draft: false
          prerelease: false
          body: |
            ## APK Release
            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== NOTIFICACIÓN ==========
      - name: Build Status
        if: always()
        run: |
          if [ ${{ job.status }} = 'success' ]; then
            echo "✅ Build completed successfully!"
          else
            echo "❌ Build failed!"
          fi
