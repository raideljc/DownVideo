name: Build APK Basica

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Compilar con Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-apk
          # La acción anterior expone la ruta del archivo generado
          path: ${{ steps.buildozer.outputs.filename }}
