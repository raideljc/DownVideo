name: Build APK with Buildozer

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK for Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Date for Cache
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV

      # ========== CACHÉ MEJORADO ==========
      - name: Restore Buildozer cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ========== INSTALAR DEPENDENCIAS ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            unzip \
            openjdk-17-jdk-headless \
            ccache \
            ninja-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # ========== INSTALAR HERRAMIENTAS ==========
      - name: Install buildozer and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36
          pip install buildozer
          pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt found"
          
      # ========== LIMPIAR CACHÉ SI ES NECESARIO ==========
      - name: Check buildozer cache size
        run: |
          du -sh ~/.buildozer 2>/dev/null || echo "No cache yet"

      # ========== COMPILAR CON LOGS DETALLADOS ==========
      - name: Build APK (Debug)
        id: buildozer
        run: |
          set -e
          echo "🔨 Starting Buildozer compilation..."
          buildozer -v android debug 2>&1 | tee build.log
          
          # Verificar que se creó el APK
          if [ ! -d "bin" ] || [ -z "$(ls bin/*.apk 2>/dev/null)" ]; then
            echo "❌ APK not created. Checking buildozer cache..."
            du -sh ~/.buildozer/android 2>/dev/null || true
            echo "Last 100 lines of build log:"
            tail -100 build.log
            exit 1
          fi
          
          APK_FILE=$(ls -t bin/*.apk 2>/dev/null | head -1)
          echo "✅ APK created: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_FILE)" >> $GITHUB_OUTPUT
          ls -lah bin/

      # ========== GUARDAR CACHÉ ==========
      - name: Save Buildozer cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      # ========== SUBIR ARTEFACTOS ==========
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk-debug
          path: bin/*.apk
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7

      # ========== CREAR RELEASE ==========
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== NOTIFICACIÓN FINAL ==========
      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f "bin/*.apk" ]; then
            echo "✅ APK Generated Successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          fi
